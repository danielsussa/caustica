<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>3D Render — experimento</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd; font-family: monospace; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #screen { display: block; width: 100vw; height: 100vh; touch-action: none; }
  /* touch controls */
  #joystick {
    position: fixed; bottom: 24px; left: 24px;
    width: 110px; height: 110px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%;
    touch-action: none;
    z-index: 10;
  }
  #joystick-thumb {
    position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px;
    margin: -22px 0 0 -22px;
    background: rgba(255,255,255,0.20);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    pointer-events: none;
    transition: transform 0.05s linear;
  }
  .vbtn {
    position: fixed; right: 24px;
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 50%;
    color: #ddd; font-size: 20px; font-family: inherit;
    touch-action: none;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #btn-up   { bottom: 100px; }
  #btn-down { bottom: 24px; }
  #btn-l    { bottom: 176px; }
  #btn-params { bottom: 252px; font-size: 22px; display: none; }
  #btn-params.visible { display: flex; }
  .vbtn.pressed { background: rgba(255,255,255,0.20); }
  .vbtn.active  { background: rgba(255,200,120,0.35); border-color: rgba(255,200,120,0.6); }
  #btn-cursor, #btn-move, #btn-rotate, #btn-break, #btn-place, #btn-clear, #btn-quad-light, #btn-sphere-light {
    position: fixed; left: 12px;
    width: 32px; height: 32px;
    color: rgba(220,225,230,0.55);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
    touch-action: none; -webkit-user-select: none; user-select: none;
    transition: color 0.12s;
  }
  #btn-cursor:hover, #btn-move:hover, #btn-rotate:hover, #btn-break:hover, #btn-place:hover, #btn-clear:hover, #btn-quad-light:hover, #btn-sphere-light:hover {
    color: rgba(255,255,255,0.95);
  }
  #btn-cursor       { top: 12px; }
  #btn-move         { top: 48px; }
  #btn-rotate       { top: 84px; }
  #btn-break        { top: 132px; }
  #btn-place        { top: 180px; }
  #btn-quad-light   { top: 216px; }
  #btn-sphere-light { top: 252px; }
  #btn-clear        { top: 300px; }
  #btn-cursor.active, #btn-place.active, #btn-quad-light.active, #btn-sphere-light.active {
    color: rgba(255,200,120,1);
  }
  #btn-move.active, #btn-rotate.active { color: rgba(115,178,217,1); }
  #btn-break.active { color: rgba(220,120,80,1); }
  #btn-cursor svg, #btn-move svg, #btn-rotate svg, #btn-break svg, #btn-place svg, #btn-clear svg, #btn-quad-light svg, #btn-sphere-light svg {
    width: 22px; height: 22px; pointer-events: none;
  }
  /* esconde controles touch em desktops com mouse — escolha de UI: deixar
     sempre visíveis pra ser óbvio que existem. Pode trocar pra @media. */
  .hud {
    position: fixed; left: 12px; bottom: 12px;
    font-size: 12px; opacity: 0.6; pointer-events: none;
  }
  .hud a, .hud button { pointer-events: auto; }
  #lt-panel {
    position: fixed; top: 12px; right: 12px;
    background: rgba(0,0,0,0.75);
    border: 1px solid #333;
    padding: 12px;
    border-radius: 6px;
    font-family: monospace; font-size: 11px;
    color: #ddd;
    display: none;
    flex-direction: column;
    gap: 8px;
    width: 220px;
    box-sizing: border-box;
  }
  #lt-panel.open { display: flex; }
  #lt-panel h4 { margin: 0 0 4px 0; font-size: 11px; opacity: 0.7; font-weight: normal; }
  #lt-panel label { display: flex; justify-content: space-between; gap: 8px; }
  #lt-panel label span { color: #fc8; }
  #lt-panel input[type=range] { width: 100%; margin: 2px 0; }
  #lt-panel button {
    background: #222; color: #ddd; border: 1px solid #555;
    padding: 4px 8px; cursor: pointer; font-family: inherit; font-size: 11px;
    border-radius: 3px;
  }
  #lt-panel button:hover { background: #333; }
</style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="joystick"><div id="joystick-thumb"></div></div>
  <!-- btn-up/down escondidos: cena padrão (cave) é no-fly -->
  <div class="vbtn" id="btn-up" style="display:none">↑</div>
  <div class="vbtn" id="btn-down" style="display:none">↓</div>
  <div class="vbtn" id="btn-l">L</div>
  <div class="vbtn" id="btn-params">≡</div>
  <div id="btn-cursor" class="active" title="movimento de câmera (sem placement)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
    </svg>
  </div>
  <div id="btn-move" title="mover (translate)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="5 9 2 12 5 15"/>
      <polyline points="9 5 12 2 15 5"/>
      <polyline points="15 19 12 22 9 19"/>
      <polyline points="19 9 22 12 19 15"/>
      <line x1="2" x2="22" y1="12" y2="12"/>
      <line x1="12" x2="12" y1="2" y2="22"/>
    </svg>
  </div>
  <div id="btn-rotate" title="rotacionar (Y axis)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
      <path d="M21 3v5h-5"/>
    </svg>
  </div>
  <div id="btn-break" title="quebrar bloco (caverna)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m14 12-8.5 8.5a2.12 2.12 0 0 1-3-3L11 9"/>
      <path d="M15 13 9 7l4-4 6 6h3a8 8 0 0 1-7 7z"/>
    </svg>
  </div>
  <div id="btn-place" title="adicionar box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 16h6"/><path d="M19 13v6"/>
      <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l5-2.88"/>
      <path d="M16.5 9.4 7.55 4.24"/><path d="M3.29 7 12 12l8.71-5"/><path d="M12 22V12"/>
    </svg>
  </div>
  <div id="btn-quad-light" title="adicionar luz plana">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="6" rx="1"/>
      <line x1="6"  y1="14" x2="6"  y2="16"/>
      <line x1="10" y1="14" x2="10" y2="17"/>
      <line x1="12" y1="14" x2="12" y2="18"/>
      <line x1="14" y1="14" x2="14" y2="17"/>
      <line x1="18" y1="14" x2="18" y2="16"/>
    </svg>
  </div>
  <div id="btn-sphere-light" title="adicionar luz esférica">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
      <path d="M9 18h6"/>
      <path d="M10 22h4"/>
    </svg>
  </div>
  <div id="btn-clear" title="limpar tudo adicionado">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <line x1="10" x2="10" y1="11" y2="17"/>
      <line x1="14" x2="14" y1="11" y2="17"/>
    </svg>
  </div>
  <div class="hud">
    modo: <span id="mode-label">wireframe</span> · cômodo: <b id="room-label">A</b> · <b>M</b> wire/shaded/solid · <b>L</b> lighttrace · <b>R</b> path tracer · <b>WASD</b> · <b>Q/E</b> ou ↑↓ · drag/touch pra olhar · fps: <b id="fps">--</b><span id="samples-info" style="display:none"> · samples: <b id="samples">0</b></span>
  </div>
  <div id="lt-panel">
    <h4>lighttrace params</h4>
    <div>
      <label>paths/frame <span id="lt-n-val">40</span></label>
      <input type="range" id="lt-n" min="5" max="200" step="5" value="40">
    </div>
    <div>
      <label>brilho <span id="lt-alpha-val">0.08</span></label>
      <input type="range" id="lt-alpha" min="0.005" max="0.2" step="0.005" value="0.08">
    </div>
    <div>
      <label>decay/bounce <span id="lt-decay-val">0.6</span></label>
      <input type="range" id="lt-decay" min="0.1" max="0.95" step="0.05" value="0.6">
    </div>
    <div>
      <label>max bounces <span id="lt-bounces-val">4</span></label>
      <input type="range" id="lt-bounces" min="1" max="4" step="1" value="4">
    </div>
    <div>
      <label style="cursor:pointer">
        <span>splats coloridos</span>
        <input type="checkbox" id="lt-splats" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>halo gaussian</span>
        <input type="checkbox" id="lt-gaussian">
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>depth fog</span>
        <input type="checkbox" id="lt-fog" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>cor por bounce</span>
        <input type="checkbox" id="lt-colorbounce" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>linhas só nos 1ºs bounces</span>
        <input type="checkbox" id="lt-linefirst">
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>decay físico</span>
        <input type="checkbox" id="lt-physdecay" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>BVH</span>
        <input type="checkbox" id="lt-bvh" checked>
      </label>
    </div>
    <div>
      <label>variação emissão <span id="lt-emission-val">0.7</span></label>
      <input type="range" id="lt-emission" min="0" max="1" step="0.05" value="0.7">
    </div>
    <div>
      <label>frames/bounce <span id="lt-fpb-val">1</span></label>
      <input type="range" id="lt-fpb" min="1" max="15" step="1" value="1">
    </div>
    <div>
      <label>max lines/frame <span id="lt-maxlines-val">1500</span></label>
      <input type="range" id="lt-maxlines" min="100" max="8000" step="100" value="1500">
    </div>
    <div>
      <label style="cursor:pointer">
        <span>mostrar wireframe</span>
        <input type="checkbox" id="lt-wireframe">
      </label>
    </div>
    <div>
      <label>buffer <span id="lt-buffer-val">0 / 8000</span></label>
    </div>
    <div>
      <label>intersects/frame <span id="lt-intersect-stats">--</span></label>
    </div>
    <button id="lt-reset">limpar buffer</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
