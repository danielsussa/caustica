<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>3D Render — experimento</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd; font-family: monospace; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: none; }
  #screen { display: block; width: 100vw; height: 100vh; touch-action: none; }
  /* touch controls */
  #joystick {
    position: fixed; bottom: 24px; left: 24px;
    width: 110px; height: 110px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%;
    touch-action: none;
    z-index: 10;
  }
  #joystick-thumb {
    position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px;
    margin: -22px 0 0 -22px;
    background: rgba(255,255,255,0.20);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    pointer-events: none;
    transition: transform 0.05s linear;
  }
  .vbtn {
    position: fixed; right: 24px;
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 50%;
    color: #ddd; font-size: 20px; font-family: inherit;
    touch-action: none;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #btn-up   { bottom: 100px; }
  #btn-down { bottom: 24px; }
  #btn-l    { bottom: 176px; }
  #btn-params { bottom: 252px; font-size: 22px; display: none; }
  #btn-params.visible { display: flex; }
  .vbtn.pressed { background: rgba(255,255,255,0.20); }
  .vbtn.active  { background: rgba(255,200,120,0.35); border-color: rgba(255,200,120,0.6); }
  /* clear (canto direito superior) */
  #btn-clear {
    position: fixed; top: 12px; right: 12px;
    width: 32px; height: 32px;
    color: rgba(220,225,230,0.55);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
    touch-action: none; -webkit-user-select: none; user-select: none;
    transition: color 0.12s;
  }
  #btn-clear:hover { color: rgba(255,255,255,0.95); }
  #btn-clear svg { width: 22px; height: 22px; pointer-events: none; }

  /* carrossel de ferramentas (top center) */
  #tool-carousel {
    position: fixed; top: 12px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px;
    z-index: 10;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .tool-side {
    width: 36px; height: 36px;
    color: rgba(220,225,230,0.35);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.12s, transform 0.12s;
  }
  .tool-side:hover { color: rgba(255,255,255,0.85); transform: scale(1.1); }
  .tool-side svg { width: 22px; height: 22px; pointer-events: none; }
  #tool-current {
    width: 60px; height: 60px;
    background: rgba(255,200,120,0.18);
    border: 1px solid rgba(255,200,120,0.55);
    border-radius: 14px;
    color: rgba(255,210,150,1);
    display: flex; align-items: center; justify-content: center;
  }
  #tool-current svg { width: 32px; height: 32px; pointer-events: none; }
  #tool-label {
    position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(220,225,230,0.7);
    z-index: 10; pointer-events: none;
    -webkit-user-select: none; user-select: none;
    text-align: center; white-space: nowrap;
  }
  /* crosshair (visível só em break mode, gerenciado por JS) */
  #crosshair {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,200,120,0.85);
    font-size: 22px; font-family: monospace;
    z-index: 9; pointer-events: none;
    display: none;
    -webkit-user-select: none; user-select: none;
  }
  #crosshair.visible { display: block; }
  /* esconde controles touch em desktops com mouse — escolha de UI: deixar
     sempre visíveis pra ser óbvio que existem. Pode trocar pra @media. */
  .hud {
    position: fixed; left: 12px; bottom: 12px;
    font-size: 12px; opacity: 0.6; pointer-events: none;
  }
  .hud a, .hud button { pointer-events: auto; }
  #lt-panel {
    position: fixed; top: 12px; right: 12px;
    background: rgba(0,0,0,0.75);
    border: 1px solid #333;
    padding: 12px;
    border-radius: 6px;
    font-family: monospace; font-size: 11px;
    color: #ddd;
    display: none;
    flex-direction: column;
    gap: 8px;
    width: 220px;
    box-sizing: border-box;
  }
  #lt-panel.open { display: flex; cursor: default; }
  #lt-panel h4 { margin: 0 0 4px 0; font-size: 11px; opacity: 0.7; font-weight: normal; }
  #lt-panel label { display: flex; justify-content: space-between; gap: 8px; }
  #lt-panel label span { color: #fc8; }
  #lt-panel input[type=range] { width: 100%; margin: 2px 0; }
  #lt-panel button {
    background: #222; color: #ddd; border: 1px solid #555;
    padding: 4px 8px; cursor: pointer; font-family: inherit; font-size: 11px;
    border-radius: 3px;
  }
  #lt-panel button:hover { background: #333; }
</style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="joystick"><div id="joystick-thumb"></div></div>
  <!-- btn-up/down escondidos: cena padrão (cave) é no-fly -->
  <div class="vbtn" id="btn-up" style="display:none">↑</div>
  <div class="vbtn" id="btn-down" style="display:none">↓</div>
  <div class="vbtn" id="btn-l">L</div>
  <div class="vbtn" id="btn-params">≡</div>
  <div id="tool-carousel">
    <div id="tool-prev" class="tool-side" title="anterior (←)"></div>
    <div id="tool-current"></div>
    <div id="tool-next" class="tool-side" title="próxima (→)"></div>
  </div>
  <div id="tool-label"></div>
  <div id="crosshair">+</div>
  <div id="btn-clear" title="limpar tudo adicionado">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <line x1="10" x2="10" y1="11" y2="17"/>
      <line x1="14" x2="14" y1="11" y2="17"/>
    </svg>
  </div>
  <div class="hud">
    modo: <span id="mode-label">wireframe</span> · cômodo: <b id="room-label">A</b> · <b>M</b> wire/shaded/solid · <b>L</b> lighttrace · <b>R</b> path tracer · <b>WASD</b> · <b>Q/E</b> ou ↑↓ · drag/touch pra olhar · fps: <b id="fps">--</b><span id="samples-info" style="display:none"> · samples: <b id="samples">0</b></span>
  </div>
  <div id="lt-panel">
    <h4>lighttrace params</h4>
    <div>
      <label>paths/frame <span id="lt-n-val">40</span></label>
      <input type="range" id="lt-n" min="5" max="200" step="5" value="40">
    </div>
    <div>
      <label>brilho <span id="lt-alpha-val">0.08</span></label>
      <input type="range" id="lt-alpha" min="0.005" max="0.2" step="0.005" value="0.08">
    </div>
    <div>
      <label>decay/bounce <span id="lt-decay-val">0.6</span></label>
      <input type="range" id="lt-decay" min="0.1" max="0.95" step="0.05" value="0.6">
    </div>
    <div>
      <label>max bounces <span id="lt-bounces-val">4</span></label>
      <input type="range" id="lt-bounces" min="1" max="4" step="1" value="4">
    </div>
    <div>
      <label style="cursor:pointer">
        <span>splats coloridos</span>
        <input type="checkbox" id="lt-splats" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>halo gaussian</span>
        <input type="checkbox" id="lt-gaussian">
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>depth fog</span>
        <input type="checkbox" id="lt-fog" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>cor por bounce</span>
        <input type="checkbox" id="lt-colorbounce" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>linhas só nos 1ºs bounces</span>
        <input type="checkbox" id="lt-linefirst">
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>decay físico</span>
        <input type="checkbox" id="lt-physdecay" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>BVH</span>
        <input type="checkbox" id="lt-bvh" checked>
      </label>
    </div>
    <div>
      <label>variação emissão <span id="lt-emission-val">0.7</span></label>
      <input type="range" id="lt-emission" min="0" max="1" step="0.05" value="0.7">
    </div>
    <div>
      <label>frames/bounce <span id="lt-fpb-val">1</span></label>
      <input type="range" id="lt-fpb" min="1" max="15" step="1" value="1">
    </div>
    <div>
      <label>max lines/frame <span id="lt-maxlines-val">1500</span></label>
      <input type="range" id="lt-maxlines" min="100" max="8000" step="100" value="1500">
    </div>
    <div>
      <label>render scale <span id="lt-renderscale-val">1</span></label>
      <input type="range" id="lt-renderscale" min="0.4" max="1" step="0.05" value="1">
    </div>
    <div>
      <label style="cursor:pointer">
        <span>auto perf (FPS)</span>
        <input type="checkbox" id="lt-autoperf" checked>
      </label>
    </div>
    <div>
      <label style="cursor:pointer">
        <span>mostrar wireframe</span>
        <input type="checkbox" id="lt-wireframe">
      </label>
    </div>
    <div>
      <label>buffer <span id="lt-buffer-val">0 / 8000</span></label>
    </div>
    <div>
      <label>intersects/frame <span id="lt-intersect-stats">--</span></label>
    </div>
    <button id="lt-reset">limpar buffer</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
